name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Verify pyproject version matches release tag
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          FILE_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Release tag v$TAG_VERSION does not match pyproject.toml version $FILE_VERSION."
            echo "Building would produce a wheel labelled $FILE_VERSION, which PyPI would reject"
            echo "as a duplicate of an already-published release."
            echo ""
            echo "Most likely cause: the release PR was generated before the"
            echo "x-release-please-version annotation reached main, or before the most recent"
            echo "push, and was merged without release-please regenerating it. Check that the"
            echo "release PR's diff includes a pyproject.toml version bump before merging it."
            echo ""
            echo "To recover: set the pyproject.toml version to $TAG_VERSION on main so it"
            echo "matches .release-please-manifest.json, then let the next release cut cleanly."
            echo "Do not move the tag."
            exit 1
          fi
          echo "Building version $FILE_VERSION"

      - name: Build package
        run: python -m build

      - name: Store distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hpde-analytics-cli
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hpde-analytics-cli
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/


name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      # The release tag is authoritative. .release-please-manifest.json is written by
      # release-please in the same commit the tag points at, so the two disagreeing means
      # the release itself is malformed - that is worth blocking on. pyproject.toml is a
      # mirror, so a lag there is corrected for the build rather than failing the release:
      # a stale mirror would otherwise strand a published tag with no PyPI artifact.
      - name: Resolve and pin the build version
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          MANIFEST_VERSION=$(python -c \
            "import json;print(json.load(open('.release-please-manifest.json'))['.'])")

          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Release tag v$TAG_VERSION does not match" \
                 ".release-please-manifest.json ($MANIFEST_VERSION). The release is" \
                 "malformed - release-please writes both in the same commit. Not publishing."
            exit 1
          fi

          FILE_VERSION=$(grep -m1 '^version = ' pyproject.toml \
            | sed -E 's/^version = "([^"]+)".*/\1/' | tr -d '\r')

          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::warning::pyproject.toml says $FILE_VERSION but the release tag is" \
                 "$TAG_VERSION. Building $TAG_VERSION anyway. release-please should have" \
                 "bumped pyproject.toml; check that the file still has LF line endings" \
                 "(a CR inside a comment makes its TOML parser throw and skip the file)" \
                 "and reconcile pyproject.toml on main. See CODE_REVIEW.md #11."
            sed -i -E "s/^version = \"[^\"]+\"/version = \"$TAG_VERSION\"/" pyproject.toml
          fi

          echo "Building version $TAG_VERSION"

      - name: Build package
        run: python -m build

      - name: Store distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hpde-analytics-cli
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hpde-analytics-cli
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

